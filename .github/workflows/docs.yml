name: Docs

# Builds docs-site (Starlight) and publishes it to GitHub Pages at https://docs.flock.beer.
# The pages are regenerated from README.md / README.fa.md on every build, so the docs always
# match the README on main.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.fa.md'
      - 'docs/screenshots/**'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Pourii83/Flock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: docs-site
      - name: Generate pages from the READMEs
        run: python3 docs-site/scripts/sync-readme.py
      - name: Build
        run: npx astro build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
