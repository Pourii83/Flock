name: Release server packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: apps/client
      - name: Build package
        run: scripts/package-server.sh ${{ matrix.arch }} ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: flock-server-${{ matrix.arch }}
          path: dist/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Flock ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
