name: flock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flock}
      POSTGRES_DB: ${POSTGRES_DB:-flock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flock} -d ${POSTGRES_DB:-flock}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-flock}:${POSTGRES_PASSWORD:-flock}@db:5432/${POSTGRES_DB:-flock}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-7}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - uploads:/app/data/uploads
    # Exposed so the Android app / desktop app can reach the API directly.
    ports:
      - "${SERVER_PORT:-4000}:4000"

  web:
    build: ./apps/client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional HTTPS with automatic Let's Encrypt certificates:
  #   set DOMAIN in .env, then: docker compose --profile https up -d
  # Browsers allow camera and microphone (calls) only over HTTPS.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
