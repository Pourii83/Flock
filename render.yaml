# One-click deploy on Render: Flock (server and web app on one address) and a PostgreSQL database.
# Open the URL Render gives the service and sign in with the admin account asked for at deploy time.
# Render's disk is temporary on the free plan, so uploaded files are lost on every redeploy.
services:
  - type: web
    name: flock-server
    runtime: docker
    # The all-in-one image at the repository root (server + web app).
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The admin account, created on first start. Render asks for the password when deploying.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: FILE_RETENTION_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "50"
      # Calls need a STUN/TURN server to cross most NATs; public STUN works for many networks.
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302

databases:
  - name: flock-db
    databaseName: flock
    user: flock
    plan: free
