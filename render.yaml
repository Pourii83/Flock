# One-click deploy on Render: the Flock server (API + realtime) and a PostgreSQL database.
# Use it with the apps or the web app: point them at the URL Render gives the service.
# Render's disk is temporary on the free plan, so uploaded files are lost on every redeploy.
services:
  - type: web
    name: flock-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: FILE_RETENTION_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "50"
      # Calls need a STUN/TURN server to cross most NATs; public STUN works for many networks.
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302

databases:
  - name: flock-db
    databaseName: flock
    user: flock
    plan: free
