plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.flock'
version = '1.0.0'

android {
  namespace "app.flock.pip"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.activity:activity-ktx:1.10.1"
}
